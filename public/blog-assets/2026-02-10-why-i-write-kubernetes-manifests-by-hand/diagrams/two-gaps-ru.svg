<svg xmlns="http://www.w3.org/2000/svg" width="320" height="620" viewBox="0 0 320 620"><title>У голого YAML один разрыв, у чарта Helm два</title><desc>Два пути от того, что ты пишешь, до живого объекта. Голый YAML: твой файл проходит через API-сервер, который подставляет значения по умолчанию, применяет admission и контроллеры, и попадает в живой объект, поэтому разрыв один. Чарт Helm: параметры и шаблоны проходят рендеринг и дают отрендеренный YAML, затем тот же шаг API-сервера приводит к живому объекту, поэтому разрывов два.</desc><path fill="#0f172a" d="M0 0h320v620H0z"/><text y="21.48" fill="#e2e8f0" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="24" style="white-space:pre" transform="translate(10 10)">Голый YAML: один разрыв</text><g stroke-linecap="round"><path fill="#1e293b" d="M22 50c57.23 2 118.45 3.95 226 0 7.89 1.33 9.79 5.37 12 12-3.04 8.8.35 12.79 0 24 2.59 5.7-7.37 9.92-12 12-69.82-6.21-146.28-6.16-226 0-11.37-1.02-10.59-3.43-12-12 2.01-7.73 1.17-13.88 0-24 2.92-9.24 5.27-9.44 12-12"/><path fill="none" stroke="#64748b" stroke-width="2" d="M22 50c45.6-1.49 93.98.29 226 0M22 50c45.52-1.67 90.77-.6 226 0m0 0c6.51-1.39 13.21 4.18 12 12m-12-12c9.38 1.02 13.15 4.82 12 12m0 0c.41 8.41.48 18.15 0 24m0-24c.03 9.54-.01 17.84 0 24m0 0c1.69 9.07-3.16 13.68-12 12m12-12c.65 9.6-4.98 12.4-12 12m0 0c-64.65 1.56-132.92-1.27-226 0m226 0c-54.3.81-108.78-.64-226 0m0 0c-7.27-1.49-12.21-2.98-12-12m12 12c-7.85-1.73-14.08-5.31-12-12m0 0c-.91-4.8.2-10.56 0-24m0 24c-.54-7.29.77-14.66 0-24m0 0c.02-9.6 4.76-12.19 12-12M10 62c-1.1-8.22 3.8-10.02 12-12"/></g><text x="125" y="18.795" fill="#e2e8f0" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="21" style="white-space:pre" text-anchor="middle" transform="translate(10 61)">Твой YAML-файл</text><g fill="none" stroke="#f59e0b" stroke-linecap="round" stroke-width="2"><path d="M49.2 97.56c.28 13.5 1.02 67.99 1.32 81.22m.46-82.5c.26 13.18-1.1 67.22-1.13 80.78m-8.21