tica, Arial, sans-serif" font-size="24" text-anchor="middle"><text x="125" y="21.48" style="white-space:pre" transform="translate(10 283)">Системная</text><text x="125" y="51.48" style="white-space:pre" transform="translate(10 283)">группа нод</text></g><g fill="#94a3b8" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle"><text x="125" y="17.9" style="white-space:pre" transform="translate(10 349)">taint CriticalAddonsOnly</text><text x="125" y="42.9" style="white-space:pre" transform="translate(10 349)">Cluster Autoscaler или</text><text x="125" y="67.9" style="white-space:pre" transform="translate(10 349)">фиксированный размер</text></g><g stroke-linecap="round"><path fill="#1e293b" d="M312 269c59.67.58 121.56-.55 186 0 18.49 1.61 28.93 8.17 32 32 4.37 26.21 1.78 54.58 0 105-2.19 21.51-7.18 33.22-32 32-41.4 3.01-81.47-1.79-186 0-20.09-.2-29.84-13.24-32-32-1.23-29.97 3.23-57.86 0-105 .47-19.95 9.05-28.44 32-32"/><path fill="none" stroke="#14b8a6" stroke-width="2" d="M312 269c35.9.04 73.14-.85 186 0m-186 0c72.43 1.83 145.46 1.51 186 0m0 0c22.9 1.97 33.53 9.99 32 32m-32-32c23.06.43 32.16 9.25 32 32m0 0c-.79 40.01-.33 81.18 0 105m0-105c-.72 39.39-.79 79.39 0 105m0 0c-1.03 21.93-10.83 32.05-32 32m32-32c-2.03 22.98-9.9 34.08-32 32m0 0c-60.47.12-125.16-1.11-186 0m186 0c-65.83.02-130.02.34-186 0m0 0c-19.95-1.1-33.9-8.91-32-32m32 32c-23.07-.09-30.4-9.08-32-32m0 0c.31-21.92 1.78-45.13 0-105m0 105c1.78-41.51 1.47-82.92 0-105m0 0c1.28-19.82 9.66-31.87 32-32m-32 32c.74-20.11 12.83-33.44 32-32"/></g><text x="125" y="21.48" fill="#e2e8f0" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="24" style="white-space:pre" text-anchor="middle" transform="translate(280 283)">NodePool в Karpenter</text><g fill="#94a3b8" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle"><text x="125" y="17.9" style="white-space:pre" transform="translate(280 319)">запускают ноды</text><text x="125" y="42.9" style="white-space:pre" transform="translate(280 319)">для подов приложений</text></g><g fill="#f59e0b" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle"><text x="125" y="17.9" style="white-space:pre" transform="translate(10 450)">Не принимает поды</text><text x="125" y="42.9" style="white-space:pre" transform="translate(10 450)">приложений: нет toleration</text></g><g fill="#f59e0b" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle"><text x="125" y="17.9" style="white-space:pre" transform="translate(280 450)">Игнорирует системные</text><text x="125" y="42.9" style="white-space:pre" transform="translate(280 450)">поды: обязательная</text><text x="125" y="67.9" style="white-space:pre" transform="translate(280 450)">метка неизвестна</text></g></svg>