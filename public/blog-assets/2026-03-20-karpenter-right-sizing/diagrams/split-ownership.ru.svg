<svg xmlns="http://www.w3.org/2000/svg" width="540" height="535" viewBox="0 0 540 535"><title>Разделение на время миграции между Cluster Autoscaler и Karpenter</title><desc>Системные поды имеют toleration для taint CriticalAddonsOnly и обязательную node affinity к системной группе нод, которая остаётся за Cluster Autoscaler или с фиксированным размером. У подов приложений toleration нет, поэтому группа нод с taint им не подходит, а ноды для них запускают NodePool в Karpenter. Системные поды Karpenter игнорирует, потому что не знает их обязательную метку.</desc><path fill="transparent" d="M0 0h540v535H0z"/><g stroke-linecap="round"><path fill="#1e293b" d="M42 10c42.05-1.3 92.07-.35 186 0 18.3.3 28.8 9.7 32 32 .69 28.17 2.35 55.26 0 75 2.86 24.17-10.75 30.21-32 32-43.05 2.32-77 2.32-186 0-19.5.75-34.88-8.1-32-32 1.81-13.46 1.56-31.66 0-75C7.65 19.01 22.16 8.17 42 10"/><path fill="none" stroke="#14b8a6" stroke-width="2" d="M42 10c38.73.93 75.96 1.26 186 0M42 10c62.88-.2 127.45-1.94 186 0m0 0c23.01-.02 31.65 10.66 32 32m-32-32c20.9-.25 31.54 10.18 32 32m0 0c-1.33 28.45-1.98 57.27 0 75m0-75c.15 25.61-1.4 50.41 0 75m0 0c-1.27 20.28-11.29 30.54-32 32m32-32c.2 20.84-9.51 34.14-32 32m0 0c-72.75.05-149.17-1.87-186 0m186 0c-39.32 1.66-78.67 1.9-186 0m0 0c-19.79.68-31.93-10.85-32-32m32 32c-20.91.51-30.22-12.35-32-32m0 0c1.23-17.8-.67-40.08 0-75m0 75c-.64-29.55-.38-58.77 0-75m0 0C8.46 22.3 20.41 10.6 42 10M10 42C8.83 18.71 20.56 9.49 42 10"/></g><text x="125" y="21.48" fill="#e2e8f0" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="24" style="white-space:pre" text-anchor="middle" transform="translate(10 24)">Системные поды</text><g fill="#94a3b8" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle"><text x="125" y="17.9" style="white-space:pre" transform="translate(10 60)">toleration +</text><text x="125" y="42.9" style="white-space:pre" transform="translate(10 60)">обязательная</text><t