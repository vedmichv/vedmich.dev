<svg xmlns="http://www.w3.org/2000/svg" width="540" height="455" viewBox="0 0 540 455"><title>Migration-time split between Cluster Autoscaler and Karpenter</title><desc>System pods have a toleration for the CriticalAddonsOnly taint and a required node affinity for the system node group, which stays with Cluster Autoscaler or a fixed size. Application pods have no toleration, so the tainted node group never fits them, and Karpenter NodePools launch nodes for them. Karpenter ignores the system pods because it does not know their required label.</desc><path fill="transparent" d="M0 0h540v455H0z"/><g stroke-linecap="round"><path fill="#1e293b" d="M38.5 10c43.72-1.34 95.4-.39 193 0 15.96.3 25.3 8.53 28.5 28.5.48 21.22 2.14 41.35 0 57 2.86 21.84-9.58 26.71-28.5 28.5-44.54 2.31-79.98 2.31-193 0-17.17.75-31.38-6.93-28.5-28.5 1.55-9.67 1.29-24.08 0-57C7.65 17.84 20.99 8.17 38.5 10"/><path fill="none" stroke="#14b8a6" stroke-width="2" d="M38.5 10c40.13.95 78.76 1.28 193 0m-193 0c65.28-.24 132.26-1.98 193 0m0 0c20.67-.02 28.15 9.49 28.5 28.5M231.5 10c18.57-.25 28.04 9.01 28.5 28.5m0 0c-1.31 21.52-1.97 43.4 0 57m0-57c.28 19.64-1.28 38.49 0 57m0 0c-1.27 17.95-10.13 27.04-28.5 28.5M260 95.5c.2 18.51-8.35 30.64-28.5 28.5m0 0c-75.54.04-154.75-1.87-193 0m193 0c-40.82 1.7-81.66 1.95-193 0m0 0c-17.46.68-28.43-9.68-28.5-28.5M38.5 124c-18.58.51-26.72-11.18-28.5-28.5m0 0c1.05-13.22-.85-30.91 0-57m0 57c-.61-22.44-.35-44.57 0-57m0 0C8.46 21.14 19.25 10.6 38.5 10M10 38.5C8.83 17.55 19.4 9.49 38.5 10"/></g><text x="125" y="21.48" fill="#e2e8f0" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="24" style="white-space:pre" text-anchor="middle" transform="translate(10 24)">System pods</text><g fill="#94a3b8" dominant-baseline="alphabetic" font-family="Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle"><text x="125" y="17.9" style="white-space:pre" transform="translate(10 60)">toleration +</text><text x="125" y="42.9" style="white-space:pre" tran